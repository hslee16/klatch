name: Platform tests

# cargo test --workspace on the two platforms the release only builds and smoke tests: Linux aarch64 and macOS x86_64
# (#1247, part of #1232). Run by hand; it is not on pull requests and has no schedule (the human's rule, 2026-11-14:
# CI stays lightweight). A green run is what lets the README platform table say "tested" for these two rows.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, macos-15-intel]
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: proto
      - name: Unit and integration tests
        run: cargo test --workspace --locked
