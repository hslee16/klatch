name: Release dry run

# A pull request that touches how a release is built runs the whole build half of a release (#437): the same
# build-release.yml that release.yml calls, with the tag the version files name. It publishes nothing and holds no
# credential.
#
# What it cannot rehearse, because it needs the real release and the maintainer: the uploads to PyPI, npm and
# crates.io, the build provenance attestations and the cosign signature (they need the release workflow's identity),
# and attaching files to a GitHub release. Those jobs only run in release.yml.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build-release.yml
      - .github/workflows/release-dry-run.yml
      - clients/python/pyproject.toml
      - clients/python/build_wheels.py
      - clients/python/klatch_client.py
      - clients/python/package/**
      - clients/typescript/package.json
      - clients/typescript/package-lock.json
      - clients/typescript/tsconfig.build.json
      - proto/Cargo.toml
      - proto/Cargo.lock
      - proto/klatch/Cargo.toml
      - proto/about.toml
      - proto/about.hbs
      - proto/THIRD-PARTY-LICENSES.txt
      - proto/deny.toml
      - install/**
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Which tag this would be
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the tag the release would carry: v and the Python spelling of the version
      - id: tag
        run: |
          set -euo pipefail
          pypi=$(sed -n 's/^version = "\(.*\)"$/\1/p' clients/python/pyproject.toml | head -1)
          echo "tag=v$pypi" >> "$GITHUB_OUTPUT"
          echo "A release now would be tagged v$pypi"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
