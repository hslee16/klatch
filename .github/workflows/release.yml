name: Release

# Publishes the Python package to PyPI through trusted publishing (OIDC, no token is stored). The publish job runs in
# the protected `release` environment, which needs the maintainer's approval, and PyPI only accepts this exact
# repository, workflow file and environment name. All the building lives in build-release.yml, which this workflow
# calls and which release-dry-run.yml also runs on pull requests, so a release is never the first run of its builds.
#
# The release also attaches the klatch and klatch-server binaries (#1236), as archives with checksums, to the GitHub
# release: macOS arm64 and
# x86_64, Linux x86_64 and aarch64 as a dynamic build (glibc 2.34 or later, built on Ubuntu 22.04) and as a fully
# static musl build that needs no system libraries. Each archive holds both binaries, LICENSE
# and THIRD-PARTY-LICENSES.txt (SQLCipher's BSD licence requires its notice in a binary distribution). Beside each
# archive go a CycloneDX SBOM covering both binaries, and for the whole release SHA256SUMS, its Sigstore signature, and GitHub build
# provenance attestations for every file.
#
# One release tag publishes all three: PyPI, npm and crates.io, which must carry the same pre-release number (Python
# 0.1.0.dev1, npm 0.1.0-dev.1 and the crate 0.1.0-dev.1 are one release). Bump the three versions together before
# tagging; each job fails if its version does not match the tag. A crates.io version can never be deleted, only
# yanked, so the `release` environment approval is the last chance to stop a crate.
#
# npm: the package must exist before npm lets you configure a trusted publisher, so the first version of
# @klatch/client is published by hand. Then set the repository variable NPM_TRUSTED_PUBLISHING to true to switch the
# npm job on.
on:
  release:
    types: [published]
  # Run one registry's job for an existing tag, for example after a failed npm stage or to try the crates.io job on its
  # own. The version of that package must not already be published. Still needs the release environment approval
  # (and, for npm, the approval on npmjs.com).
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag the package belongs to (for example v0.1.0.dev1)
        required: true
      target:
        description: Which registry to publish to
        type: choice
        options: [npm, crates, binaries, python]
        required: true

permissions:
  contents: read

jobs:
  # All the building, shared with the pull request dry run (build-release.yml). The publish jobs below wait for all of
  # it, so nothing is published unless every file that this run builds was built.
  build:
    name: Build
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      python: ${{ github.event_name == 'release' || inputs.target == 'python' }}
      npm: ${{ github.event_name == 'release' || inputs.target == 'npm' }}
      crates: ${{ github.event_name == 'release' || inputs.target == 'crates' }}
      binaries: ${{ github.event_name == 'release' || inputs.target == 'binaries' || inputs.target == 'python' }}

  python-publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.target == 'python'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/klatch/
    permissions:
      id-token: write
    steps:
      # the sdist and the pure-Python wheel (every other platform), and the four platform wheels
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          merge-multiple: true
          path: dist/

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm-publish:
    name: Stage on npm (a maintainer approves it on npmjs.com)
    if: vars.NPM_TRUSTED_PUBLISHING == 'true' && (github.event_name == 'release' || inputs.target == 'npm')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/@klatch/client
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later and Node 22.14 or later; node 22 ships an older npm.
      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist/

      # The trusted publisher on npmjs.com is set to stage only ("Allow npm publish" is off): this job submits the
      # package to npm's staging area and a maintainer approves it there with a security key, so CI alone can never
      # make a version public. npm refuses a pre-release without an explicit tag; `latest` is used while no stable
      # version exists, so that `npm install @klatch/client` resolves. Once there is a stable version, pre-releases
      # must go out under another tag (for example next).
      - name: Stage via trusted publishing
        run: npm stage publish --access public --tag latest ./dist/*.tgz

  crates-publish:
    name: Publish to crates.io
    if: github.event_name == 'release' || inputs.target == 'crates'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://crates.io/crates/klatch
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-dist
          path: ${{ runner.temp }}/crate-verified

      # Nothing is compiled in this job (--no-verify). The crate is packaged again from the same commit and must match
      # the package that was built and verified without the token, byte for byte; if it does not, nothing is published.
      - name: Package again and compare with the verified package
        run: |
          set -euo pipefail
          cargo package --no-verify --locked -p klatch
          (cd target/package && sha256sum klatch-*.crate) > "$RUNNER_TEMP/again.sums"
          diff "$RUNNER_TEMP/again.sums" "$RUNNER_TEMP/crate-verified/SHA256SUMS"

      # A short-lived token from crates.io trusted publishing; the action revokes it when the job ends.
      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish (no compilation here)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --locked -p klatch

  binaries-publish:
    name: Attach the binaries to the release
    if: github.event_name == 'release' || inputs.target == 'binaries'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only the installer script is taken from the repository; nothing from it is run in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: install/install.sh
          sparse-checkout-cone-mode: false

      - name: Download every archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/

      # Nothing is compiled in this job. First the files must still be what the build jobs checksummed.
      - name: Check the files against the build jobs' checksums and write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          for f in ./*.sha256; do sha256sum -c "$f"; done
          cp "$GITHUB_WORKSPACE/install/install.sh" install.sh
          sha256sum install.sh > install.sh.sha256
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS

      # GitHub build provenance: a signed statement, kept by GitHub, that these files were built by this workflow
      # from this commit. Verify with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # A second, independent way to check the downloads without the GitHub CLI: SHA256SUMS signed keylessly with
      # the workflow's identity (Sigstore).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attach to the release (an existing asset is never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
