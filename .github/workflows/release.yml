name: Release

# Publishes the Python package to PyPI through trusted publishing (OIDC, no token is stored). The publish job runs in
# the protected `release` environment, which needs the maintainer's approval, and PyPI only accepts this exact
# repository, workflow file and environment name. Binary wheels join this file later (#431).
#
# The release also attaches the klatch binary, as archives with checksums, to the GitHub release: macOS arm64 and
# x86_64, Linux x86_64 and aarch64 (glibc 2.35 or later, built on Ubuntu 22.04). Each archive holds the binary, LICENSE
# and THIRD-PARTY-LICENSES.txt (SQLCipher's BSD licence requires its notice in a binary distribution).
#
# One release tag publishes all three: PyPI, npm and crates.io, which must carry the same pre-release number (Python
# 0.1.0.dev1, npm 0.1.0-dev.1 and the crate 0.1.0-dev.1 are one release). Bump the three versions together before
# tagging; each job fails if its version does not match the tag. A crates.io version can never be deleted, only
# yanked, so the `release` environment approval is the last chance to stop a crate.
#
# npm: the package must exist before npm lets you configure a trusted publisher, so the first version of
# @klatch/client is published by hand. Then set the repository variable NPM_TRUSTED_PUBLISHING to true to switch the
# npm job on.
on:
  release:
    types: [published]
  # Run one registry's job for an existing tag, for example after a failed npm stage or to try the crates.io job on its
  # own. The version of that package must not already be published. Still needs the release environment approval
  # (and, for npm, the approval on npmjs.com).
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag the package belongs to (for example v0.1.0.dev1)
        required: true
      target:
        description: Which registry to publish to
        type: choice
        options: [npm, crates, binaries]
        required: true

permissions:
  contents: read

jobs:
  python-build:
    name: Build the Python package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag must name the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re;print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml").read(), re.M).group(1))')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - name: Package metadata test
        run: python3 -m unittest -v test_package

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: The built wheel installs and imports in a clean environment
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -I -c 'import klatch; assert klatch.PROTOCOL_VERSION == 1; print(klatch.__version__)'

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: clients/python/dist/

  python-publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: python-build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/klatch/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm-build:
    name: Build the npm package
    if: vars.NPM_TRUSTED_PUBLISHING == 'true' && (github.event_name == 'release' || inputs.target == 'npm')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: The tag must name the version in package.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          # the Python pre-release 0.1.0.dev0 and the npm pre-release 0.1.0-dev.0 are the same release
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "v$(printf '%s' "$version" | sed 's/-dev\./.dev/')" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - name: Install, build, pack and import the tarball in a clean directory
        run: |
          npm ci --ignore-scripts
          node --experimental-strip-types --test package.test.ts
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: ${{ runner.temp }}/npm-dist/

  npm-publish:
    name: Stage on npm (a maintainer approves it on npmjs.com)
    needs: npm-build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@klatch/client
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later and Node 22.14 or later; node 22 ships an older npm.
      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist/

      # The trusted publisher on npmjs.com is set to stage only ("Allow npm publish" is off): this job submits the
      # package to npm's staging area and a maintainer approves it there with a security key, so CI alone can never
      # make a version public. npm refuses a pre-release without an explicit tag; `latest` is used while no stable
      # version exists, so that `npm install @klatch/client` resolves. Once there is a stable version, pre-releases
      # must go out under another tag (for example next).
      - name: Stage via trusted publishing
        run: npm stage publish --access public --tag latest ./dist/*.tgz

  crates-build:
    name: Build the Rust package
    if: github.event_name == 'release' || inputs.target == 'crates'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag must name the version in Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          # the Python pre-release 0.1.0.dev1 and the crate pre-release 0.1.0-dev.1 are the same release
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "v$(printf '%s' "$version" | sed 's/-dev\./.dev/')" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The only compilation of the release. It runs here, where there is no token, because a dependency's build script
      # runs on whatever machine compiles it. The packaged crate is built exactly as crates.io users will build it.
      - name: Package and verify by building the packaged crate
        run: |
          set -euo pipefail
          # the registry-side checks (metadata, dependencies), then the package itself: `cargo package` builds the
          # packaged crate to verify it and, unlike a publish dry run, keeps the .crate file
          cargo publish --dry-run --locked -p klatch
          cargo package --locked -p klatch

      - name: Record the package checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crate"
          cp target/package/klatch-*.crate "$RUNNER_TEMP/crate/"
          (cd "$RUNNER_TEMP/crate" && sha256sum klatch-*.crate | tee SHA256SUMS)

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-dist
          path: ${{ runner.temp }}/crate/

  crates-publish:
    name: Publish to crates.io
    needs: crates-build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/klatch
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-dist
          path: ${{ runner.temp }}/crate-verified

      # Nothing is compiled in this job (--no-verify). The crate is packaged again from the same commit and must match
      # the package that was built and verified without the token, byte for byte; if it does not, nothing is published.
      - name: Package again and compare with the verified package
        run: |
          set -euo pipefail
          cargo package --no-verify --locked -p klatch
          (cd target/package && sha256sum klatch-*.crate) > "$RUNNER_TEMP/again.sums"
          diff "$RUNNER_TEMP/again.sums" "$RUNNER_TEMP/crate-verified/SHA256SUMS"

      # A short-lived token from crates.io trusted publishing; the action revokes it when the job ends.
      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish (no compilation here)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --locked -p klatch

  binaries-build:
    name: Build klatch (${{ matrix.target }})
    if: github.event_name == 'release' || inputs.target == 'binaries'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag must name the version in Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' proto/Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ] && [ "$TAG" != "v$(printf '%s' "$version" | sed 's/-dev\./.dev/')" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build the release binary
        working-directory: proto
        run: cargo build --release --locked -p klatch

      - name: Smoke test the built binary (version, then a whole launcher flow)
        env:
          KLATCH_BIN: ${{ github.workspace }}/proto/target/release/klatch
        run: |
          set -euo pipefail
          actual=$("$KLATCH_BIN" --version)
          [ "$actual" = "klatch $VERSION" ] || { echo "version prints '$actual', wanted 'klatch $VERSION'" >&2; exit 1; }
          clients/recipes/launcher-demo.sh

      - name: Archive with the licences and a checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="klatch-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp proto/target/release/klatch "dist/$name/klatch"
          strip "dist/$name/klatch"
          cp LICENSE proto/THIRD-PARTY-LICENSES.txt "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          python3 - "dist/$name.tar.gz" <<'PY' > "dist/$name.tar.gz.sha256"
          import hashlib, os, sys
          p = sys.argv[1]
          print(hashlib.sha256(open(p, "rb").read()).hexdigest() + "  " + os.path.basename(p))
          PY
          cat "dist/$name.tar.gz.sha256"
          tar -tzf "dist/$name.tar.gz"

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  binaries-publish:
    name: Attach the binaries to the release
    needs: binaries-build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Download every archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/

      - name: Attach to the release (an existing asset is never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
          rm ./*.sha256
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY"
