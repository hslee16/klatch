name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS is off on pull requests (#861): its runner is often never assigned and the job is cancelled after
        # 15 minutes. The local gate runs on macOS and build-release.yml builds there. Add macos-latest back to run it.
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: proto
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: nextest
      - name: Unit and integration tests
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked
      - name: The client feature and the bare build compile on their own
        run: |
          cargo build -p klatch --no-default-features --features client --locked
          cargo build -p klatch --no-default-features --locked
      - name: The package is publishable to crates.io (dry run, nothing is uploaded)
        run: cargo publish --dry-run --locked -p klatch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Client library conformance, Python and TypeScript (the Rust client runs in the workspace tests)
        run: |
          export KLATCH_BIN="$PWD/target/debug/klatch"
          (cd ../clients/python && python3 -m unittest discover -v)
          (cd .. && python3 -m unittest discover -v -s clients/recipes -p 'test_*.py')
          (cd ../clients/typescript && node --experimental-strip-types --test conformance.test.ts http.test.ts)
          (cd ../clients/typescript && npm ci --ignore-scripts && node --experimental-strip-types --test package.test.ts)
      - name: The installer (install/install.sh) against a fake release, no network
        working-directory: .
        run: sh install/test-install.sh
      - name: One release number everywhere (and the check itself notices drift)
        working-directory: .
        run: |
          release/check-versions.sh
          release/check-timeouts.sh
          release/test-check-versions.sh
          release/test-package-archive.sh
          release/test-tag-checks.sh
          release/test-compare-formula.sh
          release/test-check-package-contents.sh
          release/changelog-fragments.sh check
          release/test-changelog-fragments.sh
      # The workflows are code too: this checks their expressions, their job graph and the shell inside them.
      - name: Install actionlint (pinned release, checksum verified)
        if: runner.os == 'Linux'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz -D "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$HOME/.cargo/bin/actionlint"
      - name: Workflows pass actionlint
        if: runner.os == 'Linux'
        working-directory: .
        run: actionlint
      - name: Shell scripts pass shellcheck
        if: runner.os == 'Linux'
        working-directory: .
        run: shellcheck install/install.sh install/test-install.sh clients/recipes/launcher-demo.sh clients/recipes/readme-quickstart.sh clients/recipes/check-integration-examples.sh release/check-versions.sh release/pep440.sh release/test-pep440.sh release/check-timeouts.sh release/test-check-versions.sh release/changelog-fragments.sh release/test-changelog-fragments.sh release/package-archive.sh release/check-archive.sh release/check-packaged-server.sh release/test-package-archive.sh release/check-package-contents.sh release/test-check-package-contents.sh release/compare-formula.sh release/test-compare-formula.sh release/test-tag-checks.sh
      - name: The README quickstart runs against the real binary
        run: |
          export KLATCH_BIN="$PWD/target/debug/klatch"
          ../clients/recipes/readme-quickstart.sh
      - name: The integration guide examples run against the real binary (INTEGRATION.md, a few seconds)
        run: KLATCH_BIN="$PWD/target/debug/klatch" ../clients/recipes/check-integration-examples.sh
      - name: The launcher recipe, a whole run against the real binary (FACTORY.md)
        run: KLATCH_BIN="$PWD/target/debug/klatch" ../clients/recipes/launcher-demo.sh
      - name: Tests that need the test-clock build (a panic never prints what it carried)
        run: cargo test -p klatch --features test-clock --test no_plaintext --locked
      - name: Install cargo-about (pinned release, checksum verified)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          ABOUT_VERSION: "0.9.3"
          ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
        run: |
          set -euo pipefail
          name="cargo-about-${ABOUT_VERSION}-x86_64-unknown-linux-musl"
          gh release download "$ABOUT_VERSION" -R EmbarkStudios/cargo-about -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "${ABOUT_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-about"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-about" "$HOME/.cargo/bin/cargo-about"
      - name: Third-party licence notices are current and complete (SQLCipher, OpenSSL, libtomcrypt)
        if: runner.os == 'Linux'
        run: ./check-notices.sh
      # A Docker action, which only runs on Linux; the policy does not depend on the operating system.
      - name: Dependency policy (licences, advisories, sources, refused crypto crates)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: proto/Cargo.toml
          command: check
          arguments: --locked
