name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: proto
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: The client feature and the bare build compile on their own
        run: |
          cargo build -p klatch --no-default-features --features client --locked
          cargo build -p klatch --no-default-features --locked
      - name: The package is publishable to crates.io (dry run, nothing is uploaded)
        run: cargo publish --dry-run --locked -p klatch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Client library conformance, Python and TypeScript (the Rust client runs in the workspace tests)
        run: |
          export KLATCH_BIN="$PWD/target/debug/klatch"
          (cd ../clients/python && python3 -m unittest discover -v)
          (cd ../clients/typescript && node --experimental-strip-types --test conformance.test.ts)
          (cd ../clients/typescript && npm ci --ignore-scripts && node --experimental-strip-types --test package.test.ts)
      - name: The launcher recipe, a whole run against the real binary (FACTORY.md)
        run: KLATCH_BIN="$PWD/target/debug/klatch" ../clients/recipes/launcher-demo.sh
      - name: Tests that need the test-clock build (a panic never prints what it carried)
        run: cargo test -p klatch --features test-clock --test no_plaintext --locked
      - name: Install cargo-about (pinned release, checksum verified)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          ABOUT_VERSION: "0.9.3"
          ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
        run: |
          set -euo pipefail
          name="cargo-about-${ABOUT_VERSION}-x86_64-unknown-linux-musl"
          gh release download "$ABOUT_VERSION" -R EmbarkStudios/cargo-about -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "${ABOUT_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-about"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-about" "$HOME/.cargo/bin/cargo-about"
      - name: Third-party licence notices are current and complete (SQLCipher, OpenSSL, libtomcrypt)
        if: runner.os == 'Linux'
        run: ./check-notices.sh
      # A Docker action, which only runs on Linux; the policy does not depend on the operating system.
      - name: Dependency policy (licences, advisories, sources, refused crypto crates)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: proto/Cargo.toml
          command: check
          arguments: --locked
