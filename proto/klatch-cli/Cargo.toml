[package]
name = "klatch-cli"
description = "The klatch command line and hook entry point"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "klatch"
path = "src/main.rs"

[features]
# A test build only: lets KLATCH_NOW set the clock so time-dependent behaviour can be tested end to end. The
# shipped binary is built without it and has no way to move its clock (DESIGN section 26.5).
test-clock = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
klatch-core.workspace = true
klatch-gateway.workspace = true
klatch-harness.workspace = true
klatch-session.workspace = true
klatch-store.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
klatch-protocol.workspace = true
