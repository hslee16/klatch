[package]
name = "klatch-server"
description = "The klatch server binary: a Claude Code channel over stdio today, loopback intake and HTTP later (epic #1056)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Packaged but not published (#1236, decision D1): `klatch-server` is the second binary of every release archive, the
# platform wheels and the Homebrew formula, and stays off crates.io, so `cargo install klatch` keeps installing only the
# network-free binary. The `klatch` binary stays network-free; whatever opens a socket lives in this crate, with its own
# scan test (tests/no_network.rs).

[[bin]]
name = "klatch-server"
path = "src/main.rs"

[dependencies]
# the library with its default features: the engine, the member setup (`klatch::member`) and the MCP front end
klatch = { path = "../klatch" }
anyhow.workspace = true
serde_json.workspace = true
libc = "0.2"
sha2 = "0.10"
subtle = "2"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The WebSocket frame layer only (#112): no `handshake` feature, so no `http`, `httparse` or `sha1` (that crate is banned by
# deny.toml); loopback.rs parses the upgrade request and wire_ws.rs makes the accept key. Synchronous, no runtime.
tungstenite = { version = "0.30", default-features = false }
# Already in the tree under rustls. Used for one thing here: the SHA-1 that RFC 6455 puts in the upgrade answer (`Sec-WebSocket-
# Accept`), which proves nothing about anyone and is no security boundary; ring names it for legacy use only.
ring = { version = "0.17", default-features = false }

[dev-dependencies]
# the Rust client's socket connect (#1095) and HTTP connect (#1122) are features the server's own binary never links: only
# these tests ask for them
klatch = { path = "../klatch", features = ["client-socket", "client-http"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
