[package]
name = "klatch-bench"
description = "Scripted scenarios that drive the real klatch binary, with a report and a bug corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "klatch-bench"

[dependencies]
rusqlite.workspace = true
serde_json.workspace = true
# the read-only store check at the end of each scenario (#621) uses the engine's own reader
klatch = { path = "../klatch" }

[features]
# `judge-eval --judge jev` on the real HTTPS transport (klatch's `jev-http`); off by default so a plain build, and the
# no-network audit of default builds, never carry an HTTP client
jev-http = ["klatch/jev-http"]

[dev-dependencies]
rusqlite.workspace = true
