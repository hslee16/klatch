[package]
name = "klatch"
description = "A substrate for agent rooms: claims, asks, offers, a board and a durable encrypted log, as a command line, a wire protocol and a Rust client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# cargo-binstall: install the prebuilt release archive instead of compiling (the archives are built by release.yml).
# The URL uses the crate version for both the tag and the file, which is right for a stable release (v0.1.0 and
# klatch-0.1.0-...). A pre-release tag differs from its version (v0.1.0.dev1 against 0.1.0-dev.1), so binstall does not
# find those and compiles from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/klatch-{ version }-{ target }.tar.gz"
bin-dir = "klatch-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "klatch"
path = "src/lib.rs"

[[bin]]
name = "klatch"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The wire protocol and the Rust client (`klatch::protocol`, `klatch::client`): serde and serde_json only, no
# SQLCipher, no OpenSSL, no keystore. A Rust integrator depends on `klatch` with
# `default-features = false, features = ["client"]`.
client = ["dep:serde", "dep:serde_json"]
# The engine and the command line: store, keys, gateway, session, harness and the `klatch` binary.
cli = [
    "client",
    "serde_json/preserve_order",
    "dep:anyhow",
    "dep:clap",
    "dep:libc",
    "dep:rusqlite",
    "dep:zeroize",
    "dep:getrandom",
    "dep:sha2",
    "dep:data-encoding",
    "dep:subtle",
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:security-framework",
]
# A test build only: lets KLATCH_NOW set the clock so time-dependent behaviour can be tested end to end. The
# shipped binary is built without it and has no way to move its clock (DESIGN section 26.5).
test-clock = []
# The real HTTPS transport to Jev (`klatch::jev::http`, #871): ureq 3 with rustls and the bundled web PKI roots, no
# other feature (no gzip, no proxy, no platform verifier, no cookies, no json). OFF by default and not in `cli` or
# `client`, so the shipped binary, the wheels and the npm package do not link an HTTP client.
jev-http = ["client", "dep:ureq"]
# The Rust client's connect to the klatch-server daemon over a Unix socket (`Client::connect_socket`, #1095): one file,
# `src/client/socket.rs`, naming `UnixStream` and nothing else. OFF by default and not in `cli` or `client`, so the
# shipped `klatch` binary contains no socket code; a Rust integrator asks for it with `features = ["client-socket"]`.
client-socket = ["client"]
# The Rust client's connect to `klatch-server http` over TCP and server-sent events (`Client::connect_http`, #1122): one
# file, `src/client/http.rs`, naming `TcpStream` and nothing else, loopback http urls only. OFF by default and not in `cli`
# or `client`, so the shipped `klatch` binary, the wheels, the npm package and the Homebrew build contain no network
# socket type; a Rust integrator asks for it with `features = ["client-http"]`.
client-http = ["client"]

[lints.rust]
# cfg(kani) is set by `cargo kani` only (proto/scripts/kani); cfg(shuttle) by RUSTFLAGS in proto/scripts/shuttle only
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(shuttle)'] }

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
zeroize = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }
data-encoding = { version = "2", optional = true }
subtle = { version = "2", optional = true }
# The admin passphrase verifier (#1233): Argon2id, no other feature (no password-hash, no rand_core, no parallel).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }

# Randomized-schedule tests of the std-thread code (#406, proto/scripts/shuttle). Only a build with
# RUSTFLAGS="--cfg shuttle" compiles it in; a normal build never links it.
[target.'cfg(shuttle)'.dependencies]
shuttle = "=0.9.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[dev-dependencies]
serde_json.workspace = true
# Property tests (epic #396, RESEARCH-NOTES section 42). Pinned exactly (it is beta software), and static-engine so
# the engine is an ordinary dependency that --locked and cargo-deny can see; the default build compiles the engine in
# a nested cargo build outside the lockfile.
hegeltest = { version = "=0.52.6", features = ["static-engine"] }
