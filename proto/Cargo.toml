[workspace]
resolver = "3"
members = ["klatch-core", "klatch-store", "klatch-cli", "klatch-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
klatch-core = { path = "klatch-core" }
klatch-store = { path = "klatch-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
