[package]
name = "spike"
version = "0.0.0"
edition = "2021"

[features]
default = []
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
plain = ["rusqlite/bundled"]

[dependencies]
rusqlite = { version = "0.42.0", default-features = false }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
